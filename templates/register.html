{% extends 'base.html' %}
{% block title %}Register - ASK AgriHub{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:550px;">
    <div class="card p-4 shadow">
        <div class="text-center mb-4">
            <i class="bi bi-tree-fill text-success fs-1"></i>
            <h3 class="fw-bold mt-2">Join ASK AgriHub</h3>
            <p class="text-muted small">Register to buy or sell agricultural products</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your full name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Farm / Business Name</label>
                <input type="text" name="farm_name" class="form-control" placeholder="e.g. Kamau Organic Farm" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="+254...">
            </div>
            <div class="mb-3">
                <label class="form-label">County</label>
                <select name="county" class="form-select" required>
                    <option value="">Select County</option>
                    {% for county in ['Mombasa','Kwale','Kilifi','Tana River','Lamu','Taita Taveta','Garissa','Wajir','Mandera','Marsabit','Isiolo','Meru','Tharaka-Nithi','Embu','Kitui','Machakos','Makueni','Nyandarua','Nyeri','Kirinyaga','Murang\'a','Kiambu','Turkana','West Pokot','Samburu','Trans Nzoia','Uasin Gishu','Elgeyo Marakwet','Nandi','Baringo','Laikipia','Nakuru','Narok','Kajiado','Kericho','Bomet','Kakamega','Vihiga','Bungoma','Busia','Siaya','Kisumu','Homa Bay','Migori','Kisii','Nyamira','Nairobi'] %}
                    <option>{{ county }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-agri w-100 fw-bold btn-lg">Create Account</button>
        </form>
        <p class="text-center mt-3 small">Already have an account? <a href="/login" class="text-success fw-semibold">Login here</a></p>
    </div>
</div>
{% endblock %}
