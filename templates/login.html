{% extends 'base.html' %}
{% block title %}Login - ASK AgriHub{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:450px;">
    <div class="card p-4 shadow">
        <div class="text-center mb-4">
            <i class="bi bi-tree-fill text-success fs-1"></i>
            <h3 class="fw-bold mt-2">Welcome Back</h3>
            <p class="text-muted small">Login to your AgriHub account</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-agri w-100 fw-bold btn-lg">Login</button>
        </form>
        <p class="text-center mt-3 small">Don't have an account? <a href="/register" class="text-success fw-semibold">Register here</a></p>
    </div>
</div>
{% endblock %}
